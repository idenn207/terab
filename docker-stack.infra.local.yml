# 로컬 인프라 전용 스택 — make infra 용
# docker config/secret은 make setup으로 사전 등록 필요

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file:
      - infra.env
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # ─── MinIO ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - infra.env
    volumes:
      - ./volumes/storage:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # ─── MinIO 버킷 초기화 ───────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    env_file:
      - infra.env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_DEFAULT_BUCKETS
      "
    networks:
      - terab-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  # ─── Redis (BullMQ 브로커) ────────────────────────────────────
  redis:
    image: redis:8-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./volumes/redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - '6379:6379'
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  terab-net:
    driver: overlay
    attachable: true
