# ─── 네트워크 ──────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no

# ─── 인증 ──────────────────────────────────────────────────────
requirepass terab1234

# ─── 영속성 (AOF) ───────────────────────────────────────────────
appendonly yes
appendfsync everysec

# ─── 메모리 ────────────────────────────────────────────────────
# BullMQ 잡 유실 방지 — 메모리 초과 시 에러 반환
maxmemory 256mb
maxmemory-policy noeviction

# ─── 로그 ──────────────────────────────────────────────────────
loglevel notice
