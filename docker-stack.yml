# Docker Swarm 프로덕션 스택
# 사용법: ./scripts/check-secrets.sh && docker stack deploy -c docker-stack.yml terab --with-registry-auth
# 로컬 개발: docker-compose.local.yml 사용

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16
    env_file:
      - infra.prod.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 120s

  # ─── MinIO (S3 호환 오브젝트 스토리지) ───────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - infra.prod.env
    volumes:
      - /volume1/storage:/data
    ports:
      - '9001:9001'
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        window: 60s

  # ─── MinIO 버킷 초기화 (bucket only, mc) ──────────────────────
  # 모든 로직은 entrypoint 인라인 — Swarm config 의존 없음.
  # overlay DNS (minio:9000) 로 접근, public endpoint 는 overlay 내부에서 해석 불가.
  # CORS 는 MinIO 서버의 MINIO_API_CORS_ALLOW_ORIGIN 환경변수가 전역 처리 (per-bucket API 미지원).
  # MPU 잔재 정리는 API 의 upload-session.cleanup.worker 가 담당 (lifecycle 불필요).
  minio-init:
    image: minio/mc:latest
    env_file:
      - infra.prod.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        ENDPOINT=http://minio:9000

        # 0) MinIO 준비 대기 — alias set 이 endpoint 검증을 겸함
        echo "Waiting for MinIO..."
        until mc alias set local "$${ENDPOINT}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          sleep 2
        done
        mc ready local

        # 1) 버킷 (멱등)
        mc mb --ignore-existing "local/$${MINIO_DEFAULT_BUCKETS}"

        echo "MinIO 셋업 완료: bucket=$${MINIO_DEFAULT_BUCKETS}"
    networks:
      - terab-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 60s

  # ─── Redis (BullMQ 브로커) ────────────────────────────────────
  redis:
    image: redis:8
    command: redis-server /usr/local/etc/redis/redis.conf
    configs:
      - source: redis_config
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 60s

  # ─── Spring Boot API ──────────────────────────────────────────
  api:
    image: ghcr.io/idenn207/terab-api:latest
    command: >-
      sh -c "
      wait-for-it.sh db:5432 --timeout=30 &&
      wait-for-it.sh redis:6379 --timeout=30 &&
      wait-for-it.sh minio:9000 --timeout=30 &&
      node dist/main.js"
    env_file:
      - api.prod.env
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://0.0.0.0:3000/api/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 3
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 120s
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 60s

  # ─── MQ 서비스 (BullMQ Worker) ──────────────────────────────────────────
  mq:
    image: ghcr.io/idenn207/terab-mq:latest
    env_file:
      - mq.prod.env
    secrets:
      - firebase_credential.json
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://0.0.0.0:3001/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 120s
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 60s

  # ─── React Frontend ───────────────────────────────────────────
  web:
    image: ghcr.io/idenn207/terab-web:latest
    env_file:
      - web.prod.env
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 20s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        window: 60s

  # ─── Admin Frontend (admin.drive.skypark207.com) ──────────────
  admin:
    image: ghcr.io/idenn207/terab-admin:latest
    env_file:
      - admin.prod.env
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 20s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        window: 60s

  # ─── Nginx (리버스 프록시) ─────────────────────────────────────
  nginx:
    image: nginx:mainline
    ports:
      - '8080:80'
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    volumes:
      - /volume3/docker/terab/services/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        window: 60s

  # ─── Portainer CE (컨테이너 모니터링 UI) ─────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.portainer_agent:9001 --tlsskipverify
    ports:
      - '9443:9443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - terab-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        window: 60s

  portainer_agent:
    image: portainer/agent:latest
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer_agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume3/@docker/volumes:/var/lib/docker/volumes
    networks:
      - terab-net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        window: 60s

volumes:
  db_data:
  redis_data:
  portainer_data:

networks:
  terab-net:
    driver: overlay
    attachable: true

configs:
  redis_config:
    file: './redis.prod.conf'
  nginx_config:
    file: './services/nginx/nginx.conf'

secrets:
  firebase_credential.json:
    file: './secrets/firebase_credential.json'
