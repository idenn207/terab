# Docker Swarm 프로덕션 스택
# 사용법: ./scripts/check-secrets.sh && docker stack deploy -c docker-stack.yml terab --with-registry-auth
# 로컬 개발: docker-compose.local.yml 사용

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB_FILE: /run/configs/db_name
      POSTGRES_USER_FILE: /run/configs/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/terab_db_password
    configs:
      - source: db_name
        target: /run/configs/db_name
      - source: db_user
        target: /run/configs/db_user
    secrets:
      - terab_db_password
    volumes:
      - /volume2/docker/terab/volumes/db:/var/lib/postgresql/data
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  # ─── MinIO (S3 호환 오브젝트 스토리지) ───────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/configs/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/terab_minio_password
    configs:
      - source: minio_root_user
        target: /run/configs/minio_root_user
    secrets:
      - terab_minio_password
    volumes:
      - /volume1/storage:/data
    ports:
      - '9001:9001'
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ─── Spring Boot API ──────────────────────────────────────────
  api:
    image: ghcr.io/idenn207/terab-api:latest
    configs:
      - source: db_url
        target: /run/configs/db_url
      - source: db_user
        target: /run/configs/db_user
      - source: minio_endpoint
        target: /run/configs/minio_endpoint
      - source: minio_root_user
        target: /run/configs/minio_root_user
      - source: minio_bucket
        target: /run/configs/minio_bucket
      - source: owner_username
        target: /run/configs/owner_username
      - source: owner_nickname
        target: /run/configs/owner_nickname
      - source: jwt_access_expiry_ms
        target: /run/configs/jwt_access_expiry_ms
      - source: jwt_refresh_expiry_ms
        target: /run/configs/jwt_refresh_expiry_ms
    secrets:
      - terab_db_password
      - terab_minio_password
      - terab_jwt_secret
      - terab_owner_password
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://localhost:8080/actuator/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 3
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 120s
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ─── React Frontend ───────────────────────────────────────────
  web:
    image: ghcr.io/idenn207/terab-web:latest
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 20s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure

  # ─── Nginx (리버스 프록시) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - /volume2/docker/terab/services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ─── Portainer CE (컨테이너 모니터링 UI) ─────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.portainer_agent:9001 --tlsskipverify
    ports:
      - '9443:9443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - terab-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  portainer_agent:
    image: portainer/agent:latest
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer_agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - terab-net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

configs:
  db_url:
    external: true
  db_name:
    external: true
  db_user:
    external: true
  minio_endpoint:
    external: true
  minio_root_user:
    external: true
  minio_bucket:
    external: true
  owner_username:
    external: true
  owner_nickname:
    external: true
  jwt_access_expiry_ms:
    external: true
  jwt_refresh_expiry_ms:
    external: true

volumes:
  portainer_data:

networks:
  terab-net:
    driver: overlay
    attachable: true

secrets:
  terab_db_password:
    external: true
  terab_minio_password:
    external: true
  terab_jwt_secret:
    external: true
  terab_owner_password:
    external: true
