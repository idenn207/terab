# Docker Swarm 프로덕션 스택
# 사용법: ./scripts/check-secrets.sh && docker stack deploy -c docker-stack.yml terab --with-registry-auth
# 로컬 개발: docker-compose.local.yml 사용

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB_FILE: /run/configs/DB_NAME
      POSTGRES_USER_FILE: /run/configs/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    configs:
      - { source: DB_NAME, target: /run/configs/DB_NAME }
      - { source: DB_USER, target: /run/configs/DB_USER }
    secrets:
      - DB_PASSWORD
    volumes:
      - /volume2/docker/terab/volumes/db:/var/lib/postgresql/data
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$(cat /run/configs/DB_USER)" -d "$${cat /run/configs/DB_NAME}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  # ─── MinIO (S3 호환 오브젝트 스토리지) ───────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/configs/MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_PASSWORD
    configs:
      - { source: MINIO_ROOT_USER, target: /run/configs/MINIO_ROOT_USER }
    secrets:
      - MINIO_PASSWORD
    volumes:
      - /volume1/storage:/data
    ports:
      - '9001:9001'
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ─── RabbitMQ (메시지 브로커) ─────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    entrypoint:
      - /bin/sh
      - -c
      - |
        export RABBITMQ_DEFAULT_USER=$$(cat /run/configs/RABBITMQ_USERNAME)
        export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/RABBITMQ_PASSWORD)
        exec docker-entrypoint.sh rabbitmq-server
    configs:
      - { source: RABBITMQ_USERNAME, target: /run/configs/RABBITMQ_USERNAME }
    secrets:
      - RABBITMQ_PASSWORD
    volumes:
      - /volume2/docker/terab/volumes/rabbitmq:/var/lib/rabbitmq
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s

  # ─── Spring Boot API ──────────────────────────────────────────
  api:
    image: ghcr.io/idenn207/terab-api:latest
    configs:
      - { source: DB_URL, target: /run/configs/DB_URL }
      - { source: DB_USER, target: /run/configs/DB_USER }
      - { source: MINIO_ENDPOINT, target: /run/configs/MINIO_ENDPOINT }
      - { source: MINIO_ROOT_USER, target: /run/configs/MINIO_ROOT_USER }
      - { source: MINIO_BUCKET, target: /run/configs/MINIO_BUCKET }
      - { source: OWNER_USERNAME, target: /run/configs/OWNER_USERNAME }
      - { source: OWNER_NICKNAME, target: /run/configs/OWNER_NICKNAME }
      - { source: JWT_ACCESS_EXPIRY_MS, target: /run/configs/JWT_ACCESS_EXPIRY_MS }
      - { source: JWT_REFRESH_EXPIRY_MS, target: /run/configs/JWT_REFRESH_EXPIRY_MS }
      - { source: CORS_ALLOWED_ORIGINS, target: /run/configs/CORS_ALLOWED_ORIGINS }
      - { source: RABBITMQ_HOST, target: /run/configs/RABBITMQ_HOST }
      - { source: RABBITMQ_PORT, target: /run/configs/RABBITMQ_PORT }
      - { source: RABBITMQ_USERNAME, target: /run/configs/RABBITMQ_USERNAME }
    secrets:
      - DB_PASSWORD
      - MINIO_PASSWORD
      - JWT_SECRET
      - OWNER_PASSWORD
      - PASSWORD_PEPPER
      - RABBITMQ_PASSWORD
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://localhost:8080/actuator/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      replicas: 3
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 120s
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ─── Notification MS ──────────────────────────────────────────
  notification:
    image: ghcr.io/idenn207/terab-notification:latest
    configs:
      - { source: RABBITMQ_HOST, target: /run/configs/RABBITMQ_HOST }
      - { source: RABBITMQ_PORT, target: /run/configs/RABBITMQ_PORT }
      - { source: RABBITMQ_USERNAME, target: /run/configs/RABBITMQ_USERNAME }
      - { source: FIREBASE_CREDENTIALS_PATH, target: /run/configs/FIREBASE_CREDENTIALS_PATH }
    secrets:
      - RABBITMQ_PASSWORD
    networks:
      - terab-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://localhost:8082/actuator/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  # ─── React Frontend ───────────────────────────────────────────
  web:
    image: ghcr.io/idenn207/terab-web:latest
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
        monitor: 20s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure

  # ─── Nginx (리버스 프록시) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - /volume2/docker/terab/services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - terab-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ─── Portainer CE (컨테이너 모니터링 UI) ─────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    command: -H tcp://tasks.portainer_agent:9001 --tlsskipverify
    ports:
      - '9443:9443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - terab-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  portainer_agent:
    image: portainer/agent:latest
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer_agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - terab-net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

configs:
  DB_NAME: { external: true }
  DB_URL: { external: true }
  DB_USER: { external: true }
  MINIO_ENDPOINT: { external: true }
  MINIO_ROOT_USER: { external: true }
  MINIO_BUCKET: { external: true }
  OWNER_USERNAME: { external: true }
  OWNER_NICKNAME: { external: true }
  JWT_ACCESS_EXPIRY_MS: { external: true }
  JWT_REFRESH_EXPIRY_MS: { external: true }
  CORS_ALLOWED_ORIGINS: { external: true }
  RABBITMQ_HOST: { external: true }
  RABBITMQ_PORT: { external: true }
  RABBITMQ_USERNAME: { external: true }
  FIREBASE_CREDENTIALS_PATH: { external: true }

volumes:
  portainer_data:

networks:
  terab-net:
    driver: overlay
    attachable: true

secrets:
  DB_PASSWORD: { external: true }
  MINIO_PASSWORD: { external: true }
  JWT_SECRET: { external: true }
  OWNER_PASSWORD: { external: true }
  PASSWORD_PEPPER: { external: true }
  RABBITMQ_PASSWORD: { external: true }

