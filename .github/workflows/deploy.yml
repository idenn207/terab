name: Build & Push

on:
  push:
    branches: [master, v0.1]
  pull_request:
    branches: [master, v0.1]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── 테스트 (병렬) ───────────────────────────────────────────────
  test-api:
    name: Test (api)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24 (api)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Api build & type check
        working-directory: services/api
        run: |
          npm ci
          npm run build

      - name: Api tests
        working-directory: services/api
        run: npm test

  test-mq:
    name: Test (mq)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24 (mq)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/mq/package-lock.json

      - name: MQ build & type check
        working-directory: services/mq
        run: |
          npm ci
          npm run build

      - name: MQ tests
        working-directory: services/mq
        run: npm test

  test-web:
    name: Test (web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Frontend build & type check
        working-directory: services/web
        run: |
          npm ci
          npm run build

      - name: Frontend tests
        working-directory: services/web
        run: npm test

  # ─── Docker 이미지 빌드 & Push ──────────────────────────────────
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: [test-api, test-mq, test-web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./services/api
          - service: mq
            context: ./services/mq
          - service: web
            context: ./services/web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/terab-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── ghcr.io 오래된 이미지 정리 ─────────────────────────────────
  cleanup:
    name: Cleanup Old Images
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [terab-api, terab-mq, terab-web]

    steps:
      - name: Delete old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

  # ─── NAS 배포 (Swarm rolling update) ────────────────────────────
  # NAS에 설치된 self-hosted runner가 job을 직접 실행 → SSH/포트 노출 불필요
  # master 브랜치 push 에만 배포 — v0.1 push 는 빌드/이미지까지만 수행, 배포는 master merge 후
  deploy:
    name: Deploy to NAS
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    environment:
      name: production-nas
      url: https://nas

    steps:
      - name: Update api service
        run: |
          docker service update \
            --image ghcr.io/idenn207/terab-api:latest \
            --health-start-period 60s \
            --with-registry-auth \
            --force \
            terab_api

      - name: Update mq service
        run: |
          docker service update \
            --image ghcr.io/idenn207/terab-mq:latest \
            --with-registry-auth \
            --force \
            terab_mq

      - name: Update web service
        run: |
          docker service update \
            --image ghcr.io/idenn207/terab-web:latest \
            --with-registry-auth \
            --force \
            terab_web
