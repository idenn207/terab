# 로컬 개발용 docker-stack.yml override
# 사용법: docker stack deploy -c docker-stack.yml -c docker-stack.local.yml terab
# 주의: make infra (terab-infra 스택)가 먼저 실행되어 terab-infra_terab-net 네트워크가 있어야 함
#
# [현재 미사용] make dev는 docker-stack.app.local.yml을 직접 사용한다.
# 향후 docker-stack.yml 기반 배포에서 포트/replicas 등을 override할 필요가 생기면
# 이 파일을 활성화한다: make dev 타겟에 -c docker-stack.local.yml 을 추가하면 됨.

services:
  # ─── Infra ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file:
      - infra.dev.env
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    deploy:
      placement:
        constraints: []

  minio:
    env_file:
      - infra.dev.env
    volumes:
      - ./volumes/storage:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  minio-init:
    env_file:
      - infra.dev.env

  redis:
    image: redis:8-alpine
    volumes:
      - ./volumes/redis:/data
    deploy:
      placement:
        constraints: []

  # ─── App: 로컬 빌드 이미지 override ────────────────────────────
  # 주의: docker stack deploy는 build를 지원하지 않으므로 make dev가 배포 전 이미지를 빌드함
  api:
    image: terab-api:local
    env_file:
      - api.dev.env
    deploy:
      replicas: 1

  mq:
    image: terab-mq:local
    env_file:
      - mq.dev.env
    deploy:
      replicas: 1

  web:
    image: terab-web:local
    env_file:
      - web.dev.env
    deploy:
      replicas: 1

  # ─── Nginx (리버스 프록시) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro

  # ─── 로컬 불필요 서비스 제거 ─────────────────────────────────────
  portainer:
    ports: []
    deploy:
      replicas: 0

  portainer_agent:
    deploy:
      mode: replicated
      replicas: 0

configs:
  nginx_config:
    file: './services/nginx/nginx.local.conf'
  redis_config:
    file: './redis.conf'
