plugins {
  id 'org.springframework.boot' version '4.0.5'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'java'
}

group = 'com.terab'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

ext['lombok.version'] = '1.18.40'
ext {
  set('springCloudVersion', '2025.1.1')
}

repositories {
  mavenCentral()
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.5"
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  // Spring Cloud Stream (RabbitMQ binder)
  implementation 'org.springframework.cloud:spring-cloud-stream'
  implementation 'org.springframework.cloud:spring-cloud-starter-stream-rabbit'

  // Firebase Admin SDK
  implementation 'com.google.firebase:firebase-admin:9.8.0'

  // Lombok
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'

  // 테스트
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'

  // Testcontainers (통합 테스트)
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-rabbitmq'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


// =============================================================================
// 테스트 소스셋 및 태스크 설정
// =============================================================================

sourceSets {
  intTest {
    java.srcDir 'src/intTest/java'
    resources.srcDir 'src/intTest/resources'
    compileClasspath += sourceSets.main.output + sourceSets.test.output
    runtimeClasspath += sourceSets.main.output + sourceSets.test.output
  }
}

configurations {
  intTestImplementation.extendsFrom testImplementation
  intTestRuntimeOnly.extendsFrom testRuntimeOnly
  intTestCompileOnly.extendsFrom testCompileOnly
  intTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

tasks.named('test') {
  useJUnitPlatform()
  exclude '**/_*Template*'
  onlyIf {
    !testClassesDirs.asFileTree.matching {
      include '**/*Test.class', '**/*Tests.class'
      exclude '**/_*Template*'
    }.empty
  }
}

tasks.register('integrationTest', Test) {
  description = 'Runs integration tests with Testcontainers.'
  group = 'verification'
  testClassesDirs = sourceSets.intTest.output.classesDirs
  classpath = sourceSets.intTest.runtimeClasspath
  useJUnitPlatform()
  exclude '**/_*Template*'
  onlyIf {
    !testClassesDirs.asFileTree.matching {
      include '**/*Test.class', '**/*Tests.class'
      exclude '**/_*Template*'
    }.empty
  }
}

tasks.named('processIntTestResources') {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('check') {
  dependsOn tasks.named('integrationTest')
}