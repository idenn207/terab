events {
    worker_connections 1024;
}

http {
    # ─── Docker Swarm DNS (요청마다 재조회) ───────────────────────
    resolver 127.0.0.11 valid=10s;
    
    keepalive_timeout  60;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    
    # 1024바이트(1KB)보다 큰 파일만 압축 적용
    gzip_min_length 1024;

    # 압축할 파일 유형
    # gzip_types text/plain text/css application/json application/javascript text/xml;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ─── 공통 설정 ─────────────────────────────────────────────────
    # NAS용: 대용량 파일 업로드 허용
    client_max_body_size 10G;

    # 대용량 파일 전송 타임아웃
    proxy_connect_timeout       300s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;

    # ─── 서버 블록 ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name drive.skypark207.com;

        # HTTP → HTTPS 리다이렉트 (DSM Application Portal X-Forwarded-Proto 기반)
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # Nestjs API: /api/* 경로
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:3000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cookie_flags ~ Samesite=Strict;
            
            # 대용량 파일 업로드 버퍼링 비활성화 (스트리밍 업로드)
            proxy_request_buffering off;

            access_log /var/log/nginx/api-access.log main;
            error_log /var/log/nginx/api-error.log;
        }

        # React SPA: 나머지 모든 경로
        location / {
            set $web http://web:80;
            proxy_pass $web;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
        }
    }
}
