server {
    listen 80;
    server_name admin.drive.skypark207.com;

    # HTTP → HTTPS 리다이렉트 (DSM Application Portal X-Forwarded-Proto 기반)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Nestjs API: /api/* 경로 — admin 도 동일 api 컨테이너 사용 (ADMIN role claim 으로 라우트 분기)
    location /api/ {
        set $api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $api/$1$is_args$args;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_flags ~ Samesite=Strict;

        access_log /var/log/nginx/api-access.log main;
        error_log /var/log/nginx/api-error.log;
    }

    # React SPA: 나머지 모든 경로 → admin 컨테이너
    location / {
        set $admin http://admin:80;
        proxy_pass $admin;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }
}
