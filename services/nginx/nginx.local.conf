events {
    worker_connections 1024;
}

http {
    # ─── Docker Swarm DNS (요청마다 재조회) ───────────────────────
    resolver 127.0.0.11 valid=10s;
    
    keepalive_timeout  60;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    
    # 1024바이트(1KB)보다 큰 파일만 압축 적용
    gzip_min_length 1024;

    # 압축할 파일 유형
    # gzip_types text/plain text/css application/json application/javascript text/xml;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ─── 공통 설정 ─────────────────────────────────────────────────
    # NAS용: 대용량 파일은 Pre-signed URL로 대체
    client_max_body_size 1m;

    # 대용량 파일 전송 타임아웃
    proxy_connect_timeout       300s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;

    # ─── 서버 블록 ─────────────────────────────────────────────────
    # Windows: C:\Windows\System32\drivers\etc\hosts
    # Mac /etc/hosts
    # 아래 내용 추가 
    # 127.0.0.1  server.local
    # 127.0.0.1  storage.local

    # Server
    server {
        listen 80;
        server_name server.local;

        # Nestjs API: /api/* 경로
        location /api/ {
            set $api http://api:3000;
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass $api/$1$is_args$args;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cookie_flags ~ Samesite=Strict;

            access_log /var/log/nginx/api-access.log main;
            error_log /var/log/nginx/api-error.log;
        }

        # React SPA: 나머지 모든 경로
        location / {
            set $web http://web:80;
            proxy_pass $web;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
        }
    }

    # Storage
    server {
        listen 80;
        server_name storage.local;

        client_max_body_size 110G;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Access-Control-Allow-Origin http://localhost:5173 always;
        add_header Access-Control-Allow-Methods 'PUT, GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization, x-amz-*, ETag' always;
        add_header Access-Control-Expose-Headers 'ETag' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location / {
            set $minio http://minio:9000;
            proxy_pass $minio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
